<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Ведущий — Своя игра</title>
  <link rel="stylesheet" href="/shared/style.css">
</head>
<body>
  <main>
    <h1>Панель ведущего</h1>

    <div class="card" id="no-access" hidden>
      <p class="center">Нет доступа к этой комнате.<br>Создайте новую на стартовой странице.</p>
      <button onclick="location.href='/'">На главную</button>
    </div>

    <div id="panel" hidden>
      <div class="card">
        <div class="muted center">Код комнаты</div>
        <div class="room-code" id="room-code"></div>
        <div class="qr-box">
          <img id="qr" alt="QR-код для подключения">
          <div class="join-link" id="join-link"></div>
          <button class="secondary" id="copy-link">Скопировать ссылку</button>
        </div>
      </div>

      <div class="card">
        <h2>Игроки <span class="muted" id="players-count"></span></h2>
        <ul class="player-list" id="player-list"></ul>
        <p class="muted center" id="empty-hint">Пока никого нет — покажите игрокам QR-код</p>
      </div>
    </div>
  </main>

  <script src="/socket.io/socket.io.js"></script>
  <script type="module" src="/host/host.js"></script>
</body>
</html>
