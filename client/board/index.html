<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Табло — Своя игра</title>
  <link rel="stylesheet" href="/shared/style.css">
  <link rel="stylesheet" href="/shared/game.css">
</head>
<body class="board-screen">
  <main>
    <div id="empty" class="card">
      <p class="center" id="empty-text">Подключение к комнате…</p>
    </div>

    <div class="card room-access" id="room-access" hidden>
      <img class="room-qr" id="qr" alt="QR-код для входа игрокам" hidden>
      <div class="room-access-info">
        <div>Вход для игроков</div>
        <div class="room-code" id="room-code"></div>
      </div>
    </div>

    <div id="screen" hidden>
      <div class="score-strip" id="score-strip"></div>

      <div class="card" id="board-card" hidden>
        <h2 id="board-round"></h2>
        <div class="board-table" id="board-grid"></div>
      </div>

      <div class="card" id="question-card" hidden>
        <div class="question-price" id="q-price"></div>
        <div class="question-text" id="q-text"></div>
        <div class="q-media" id="q-media"></div>
        <div class="answer-text" id="q-answer"></div>
        <div class="q-media" id="q-answer-media"></div>
        <p class="center" id="status-text"></p>
      </div>
    </div>

    <div id="over" hidden>
      <div class="card">
        <h2 class="center">Итоги игры</h2>
        <div id="standings"></div>
      </div>
    </div>
  </main>

  <script src="/socket.io/socket.io.js"></script>
  <script type="module" src="/board/board.js"></script>
</body>
</html>
