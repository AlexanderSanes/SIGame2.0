# Установить в /etc/nginx/conf.d/sigame.conf (контекст http).
# Заменить game.example.com. Затем: nginx -t; certbot --nginx -d game.example.com
map $http_upgrade $sigame_connection_upgrade {
    default upgrade;
    '' close;
}
map $uri $sigame_admin_proxy {
    default "";
    ~*^/(admin|api/admin)(?:/|$) 1;
}
upstream sigame_backend {
    server 127.0.0.1:3000;
}
server {
    listen 80;
    server_name game.example.com;
    client_max_body_size 150m;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-SIGame-Admin-Proxy $sigame_admin_proxy;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $sigame_connection_upgrade;
    proxy_read_timeout 75s;
    proxy_send_timeout 75s;
    proxy_buffering off;

    # Список названий доступен на главной; создание и правки требуют пароль.
    location = /api/packs {
        limit_except GET {
            auth_basic "SIGame packs";
            auth_basic_user_file /etc/nginx/sigame.htpasswd;
        }
        proxy_pass http://sigame_backend;
    }
    location ~* ^/(packs(?:/|$)|api/packs(?:/|$)|api/upload(?:/|$)|host(?:/|$)|admin(?:/|$)|api/admin(?:/|$)) {
        auth_basic "SIGame host";
        auth_basic_user_file /etc/nginx/sigame.htpasswd;
        proxy_pass http://sigame_backend;
    }
    location / {
        proxy_pass http://sigame_backend;
    }
}
